<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隨身筆記</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --card:#f5f5f7; --line:#d2d2d7; --acc:#0a7cff; --rec:#e5322d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --mute:#9a9aa0; --card:#1c1c1e; --line:#38383a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 20px; font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  button { font:inherit; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.rec { background:var(--rec); border-color:var(--rec); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  select, input[type=text] { font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  input[type=text] { flex:1; min-width:180px; }
  .status { font-size:14px; color:var(--mute); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--mute); margin-right:6px; }
  .live .dot { background:var(--rec); animation:p 1.2s infinite; }
  @keyframes p { 50% { opacity:.25; } }
  textarea { width:100%; min-height:200px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; resize:vertical; }
  #summary { background:var(--card); border-radius:12px; padding:4px 16px 12px; margin-top:12px; }
  #summary h1,#summary h2,#summary h3 { margin:16px 0 4px; }
  #summary ul { margin:4px 0; padding-left:22px; }
  #summary li.todo { list-style:none; margin-left:-20px; }
  .note { font-size:13px; color:var(--mute); margin-top:24px; }
  .err { color:var(--rec); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>隨身筆記</h1>
  <p class="sub">錄下會議或上課內容，結束後自動整理重點、資料與待辦，並存到 Notion。</p>

  <div id="banner" class="row" hidden>
    <span>上次有 <b id="bannerLen"></b> 字還沒整理。</span>
    <button class="primary" id="bannerGo">現在整理</button>
  </div>

  <div class="row">
    <button id="toggle" class="primary">● 開始聆聽</button>
    <select id="lang">
      <option value="zh-TW">中文（台灣）</option>
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
    </select>
    <span id="status" class="status"><span class="dot"></span><span id="statusText">未開始</span></span>
  </div>

  <textarea id="transcript" placeholder="逐字稿會出現在這裡，也可以直接編輯修正錯字。"></textarea>

  <div class="row" style="margin-top:12px">
    <button id="organize">整理內容</button>
    <button id="clear">清空</button>
  </div>

  <div id="out" hidden>
    <div id="summary"></div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="title" placeholder="Notion 頁面標題">
      <button id="save" class="primary">存到 Notion</button>
    </div>
    <div id="saved" class="status"></div>
  </div>

  <p class="note">
    使用 Chrome 或 Edge（需支援語音辨識）。瀏覽器只能在頁面開著、並允許麥克風時聆聽；手機請保持螢幕亮著。
    錄音前請先取得在場人員同意。語音會送到瀏覽器廠商的語音辨識服務；逐字稿會送到你的伺服器以整理。
  </p>
</main>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const KEY = 'firstclass.transcript';
let rec, listening = false, wake = null, summaryMd = '';

const store = {
  get: () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } },
  set: v => { try { localStorage.setItem(KEY, v); } catch {} },
};

function setStatus(text, live) {
  $('statusText').textContent = text;
  $('status').classList.toggle('live', !!live);
}

// 開啟時，如果有上次沒整理的逐字稿就提示
$('transcript').value = store.get();
if ($('transcript').value.trim().length > 20) {
  $('bannerLen').textContent = $('transcript').value.length;
  $('banner').hidden = false;
}
$('bannerGo').onclick = () => { $('banner').hidden = true; organize(); };
$('transcript').addEventListener('input', () => store.set($('transcript').value));

function append(text) {
  const t = $('transcript');
  t.value += (t.value && !t.value.endsWith('\n') ? '\n' : '') + text;
  t.scrollTop = t.scrollHeight;
  store.set(t.value);
}

async function lock() {
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (listening && document.visibilityState === 'visible') lock(); });

function start() {
  if (!SR) { setStatus('這個瀏覽器不支援語音辨識，請改用 Chrome / Edge', false); return; }
  rec = new SR();
  rec.lang = $('lang').value;
  rec.continuous = true;
  rec.interimResults = true;
  let interim = '';
  rec.onresult = e => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) append(r[0].transcript.trim()); else interim += r[0].transcript;
    }
    setStatus(interim ? '聽到：' + interim.slice(-30) : '聆聽中…', true);
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { listening = false; setStatus('麥克風權限被拒絕', false); }
  };
  // 瀏覽器會在靜音一段時間後自動停止，這裡自動接續
  rec.onend = () => { if (listening) try { rec.start(); } catch {} else finish(); };
  listening = true;
  rec.start();
  lock();
  $('toggle').textContent = '■ 停止並整理';
  $('toggle').className = 'rec';
  setStatus('聆聽中…', true);
}

function stop() { listening = false; rec?.stop(); wake?.release?.(); }

function finish() {
  $('toggle').textContent = '● 開始聆聽';
  $('toggle').className = 'primary';
  setStatus('已停止', false);
  if ($('transcript').value.trim().length > 20) organize();
}

$('toggle').onclick = () => (listening ? stop() : start());
$('clear').onclick = () => { if (confirm('確定清空逐字稿？')) { $('transcript').value = ''; store.set(''); $('out').hidden = true; } };
$('organize').onclick = organize;

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function organize() {
  const transcript = $('transcript').value.trim();
  if (!transcript) return;
  $('organize').disabled = true;
  setStatus('整理中…', false);
  $('saved').textContent = '';
  try {
    summaryMd = (await api('/api/summarize', { transcript })).summary;
    $('summary').innerHTML = render(summaryMd);
    $('title').value = (summaryMd.match(/^#\s+(.*)/m) || [])[1] || '';
    $('out').hidden = false;
    setStatus('整理完成', false);
  } catch (e) {
    setStatus('整理失敗：' + e.message, false);
  } finally { $('organize').disabled = false; }
}

$('save').onclick = async () => {
  $('save').disabled = true;
  $('saved').textContent = '儲存中…';
  $('saved').classList.remove('err');
  try {
    const { url } = await api('/api/notion', { title: $('title').value, summary: summaryMd, transcript: $('transcript').value });
    $('saved').innerHTML = '';
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.textContent = '已存入 Notion，點此開啟';
    $('saved').append(a);
    store.set(''); // 已存檔，下次開啟不再提示
  } catch (e) {
    $('saved').textContent = '儲存失敗：' + e.message;
    $('saved').classList.add('err');
  } finally { $('save').disabled = false; }
};

// 簡易 Markdown 渲染（先跳脫 HTML，避免注入）
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function render(md) {
  let html = '', inList = false;
  const close = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const line of md.split('\n')) {
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); html += `<h${m[1].length}>${esc(m[2])}</h${m[1].length}>`; }
    else if ((m = line.match(/^\s*[-*]\s+\[( |x)\]\s*(.*)/i))) { if (!inList) { html += '<ul>'; inList = true; } html += `<li class="todo">${m[1] === ' ' ? '☐' : '☑'} ${esc(m[2])}</li>`; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${esc(m[1])}</li>`; }
    else if (line.trim()) { close(); html += `<p>${esc(line)}</p>`; }
  }
  close();
  return html;
}
</script>
</body>
</html>
